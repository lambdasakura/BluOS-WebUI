<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <title>BluOS</title>
  <!-- アプリとしてインストールできるようにする（タスクバー・ホーム画面に追加） -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="device">
      <span class="dot" id="conn" title="接続状態"></span>
      <strong id="deviceName">BluOS</strong>
      <span class="muted" id="deviceModel"></span>
    </div>
    <span id="indexing" class="badge" hidden>ライブラリを更新中…</span>
  </header>

  <main class="layout">
    <!-- 再生中 -->
    <section class="player" id="player" aria-label="再生中">
      <button id="btnFullClose" class="icon small full-close" title="閉じる (Esc)" aria-label="全画面表示を閉じる">✕</button>
      <div class="art-wrap" id="artWrap" title="全画面表示"><img id="art" class="art" alt=""></div>
      <div class="meta-head">
        <div class="meta">
          <div class="title" id="title">—</div>
          <div class="sub" id="subtitle"></div>
          <div class="badges"><span id="service" class="badge"></span><span id="quality" class="badge"></span></div>
        </div>
        <div class="meta-btns">
          <button id="btnFull" class="icon small" title="全画面表示" aria-label="全画面表示">
            <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
          <button id="btnFav" class="icon small fav" title="お気に入り" aria-label="お気に入り" hidden>
            <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3.2 5 6.8 5c2.1 0 3.5 1.1 5.2 3 1.7-1.9 3.1-3 5.2-3 3.6 0 5.6 3.6 4.3 6.8C19.5 16.4 12 21 12 21z"/></svg>
          </button>
          <button id="btnLove" class="icon small" title="いいね" aria-label="いいね" hidden>👍</button>
          <button id="btnBan" class="icon small" title="この局で再生しない" aria-label="この局で再生しない" hidden>👎</button>
          <button id="btnNpMenu" class="icon small" title="メニュー" aria-label="再生中の曲のメニュー">⋯</button>
        </div>
      </div>

      <div class="progress">
        <span id="elapsed">0:00</span>
        <input type="range" id="seek" min="0" max="0" value="0" step="1" aria-label="再生位置">
        <span id="total">0:00</span>
      </div>

      <div class="controls">
        <button id="btnShuffle" class="icon toggle" title="シャッフル" aria-label="シャッフル"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
        <button id="btnBack" class="icon" title="前へ" aria-label="前へ"><svg viewBox="0 0 24 24"><path d="M19 20 9 12l10-8zM5 19V5"/></svg></button>
        <button id="btnPlay" class="icon play" title="再生/一時停止" aria-label="再生/一時停止">
          <svg viewBox="0 0 24 24" class="i-play"><path d="M6 4l14 8-14 8z"/></svg>
          <svg viewBox="0 0 24 24" class="i-pause"><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></svg>
        </button>
        <button id="btnSkip" class="icon" title="次へ" aria-label="次へ"><svg viewBox="0 0 24 24"><path d="m5 4 10 8-10 8zM19 5v14"/></svg></button>
        <button id="btnRepeat" class="icon toggle" title="リピート" aria-label="リピート"><svg viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg><span class="repeat-one">1</span></button>
      </div>

      <div class="volume">
        <button id="btnMute" class="icon small" title="ミュート" aria-label="ミュート">
          <svg viewBox="0 0 24 24" class="i-vol"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
          <svg viewBox="0 0 24 24" class="i-muted"><path d="M11 5 6 9H2v6h4l5 4zM22 9l-6 6M16 9l6 6"/></svg>
        </button>
        <input type="range" id="volume" min="0" max="100" value="0" aria-label="音量">
        <span id="volumeValue" class="vol-num">0</span>
        <button id="btnSleep" class="icon small toggle sleep" title="スリープタイマー" aria-label="スリープタイマー">
          <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <span id="sleepValue" class="sleep-num"></span>
        </button>
      </div>
    </section>

    <!-- タブ -->
    <section class="panel">
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="queue" class="active">キュー</button>
        <button role="tab" data-tab="playlists">プレイリスト</button>
        <button role="tab" data-tab="favourites">お気に入り</button>
        <button role="tab" data-tab="presets">プリセット・入力</button>
        <button role="tab" data-tab="browse">ブラウズ</button>
        <button role="tab" data-tab="alarms">アラーム</button>
      </nav>

      <div class="tab-body" id="tab-queue">
        <div class="toolbar">
          <span id="queueInfo" class="muted"></span>
          <div class="btn-group">
            <button id="btnSave" class="text-btn">プレイリストに保存</button>
            <button id="btnClear" class="text-btn danger">キューをクリア</button>
          </div>
        </div>
        <ol id="queue" class="list"></ol>
        <button id="btnQueueMore" class="text-btn more-btn" hidden>さらに読み込む</button>
      </div>

      <div class="tab-body" id="tab-playlists" hidden>
        <div class="toolbar">
          <button id="btnPlBack" class="text-btn" hidden>‹ 戻る</button>
          <div id="plInfo" class="crumbs"></div>
        </div>
        <div id="plActions" class="toolbar btn-group" hidden></div>
        <ul id="playlists" class="list"></ul>
      </div>

      <div class="tab-body" id="tab-favourites" hidden>
        <div class="toolbar">
          <span id="favInfo" class="muted"></span>
          <button id="btnFavReload" class="text-btn">再読み込み</button>
        </div>
        <div id="favourites"></div>
      </div>

      <div class="tab-body" id="tab-presets" hidden>
        <div class="section-head">
          <h3>プリセット</h3>
          <button id="btnPresetEdit" class="text-btn">編集</button>
        </div>
        <div id="presets" class="grid"></div>
        <h3>入力</h3>
        <div id="inputs" class="grid"></div>
      </div>

      <div class="tab-body" id="tab-browse" hidden>
        <div class="toolbar">
          <button id="btnBrowseBack" class="text-btn" hidden>‹ 戻る</button>
          <div id="crumbs" class="crumbs"></div>
        </div>
        <form id="searchForm" class="search" hidden>
          <input type="search" id="searchInput" placeholder="検索">
          <button type="submit" class="text-btn">検索</button>
        </form>
        <div id="browseActions" class="toolbar" hidden></div>
        <div id="browse"></div>
      </div>

      <div class="tab-body" id="tab-alarms" hidden>
        <div class="toolbar">
          <span id="alarmInfo" class="muted"></span>
          <button id="btnAlarmNew" class="text-btn">＋ アラームを追加</button>
        </div>
        <form id="alarmForm" class="alarm-form" hidden>
          <div class="form-row">
            <label>時刻 <input type="time" id="alarmTime" required value="07:00"></label>
            <label>音源
              <select id="alarmSource"></select>
            </label>
          </div>
          <fieldset class="days">
            <legend>繰り返し（未選択なら 1 回のみ）</legend>
            <label><input type="checkbox" value="0">日</label><label><input type="checkbox" value="1">月</label><label><input type="checkbox" value="2">火</label><label><input type="checkbox" value="3">水</label><label><input type="checkbox" value="4">木</label><label><input type="checkbox" value="5">金</label><label><input type="checkbox" value="6">土</label>
          </fieldset>
          <div class="form-row">
            <label>音量 <input type="range" id="alarmVolume" min="0" max="100" value="30"> <span id="alarmVolumeValue" class="vol-num">30</span></label>
            <label>自動停止
              <select id="alarmDuration">
                <option value="15">15 分</option><option value="30">30 分</option><option value="45">45 分</option>
                <option value="60" selected>60 分</option><option value="90">90 分</option><option value="120">120 分</option>
                <option value="0">しない</option>
              </select>
            </label>
            <label class="check"><input type="checkbox" id="alarmFade"> フェードイン</label>
          </div>
          <div class="btn-group">
            <button type="submit" class="text-btn">保存</button>
            <button type="button" id="alarmCancel" class="text-btn">キャンセル</button>
          </div>
        </form>
        <ul id="alarms" class="list"></ul>
      </div>
    </section>
  </main>

  <div id="menu" class="menu" hidden>
    <div class="menu-sheet">
      <div class="menu-title" id="menuTitle"></div>
      <div id="menuItems"></div>
      <button class="menu-cancel" id="menuCancel">キャンセル</button>
    </div>
  </div>
  <div id="info" class="menu" hidden>
    <div class="menu-sheet info-sheet">
      <div class="menu-title" id="infoTitle"></div>
      <iframe id="infoFrame" sandbox title="技術情報"></iframe>
      <button class="menu-cancel" id="infoClose">閉じる</button>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
